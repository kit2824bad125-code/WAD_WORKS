version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fixnear-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: fixnear_db
    ports:
      - "5432:5432"
    volumes:
      - fixnear-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fixnear_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: fixnear-api
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/fixnear_db?schema=public
      JWT_SECRET: fixnear_super_secure_jwt_access_secret_2026_x89f
      JWT_REFRESH_SECRET: fixnear_super_secure_jwt_refresh_secret_2026_z12k
      CLIENT_URL: http://localhost:3000
      RAZORPAY_KEY_ID: rzp_test_FixNearMockKeyId123
      RAZORPAY_KEY_SECRET: FixNearMockSecretKey456
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: fixnear-web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  fixnear-pgdata:
